name: "WG-Easy VPN"
version: "15.5.0"
slug: "wg-easy"
description: >-
  WireGuard VPN server with the WG-Easy web interface, as a Home Assistant
  sidebar panel with no second login. Works without configuration, keeps its
  data across updates and in Home Assistant backups, and exposes each VPN
  client as Home Assistant entities through MQTT.
url: "https://github.com/felixilgatto/ha-wg-easy/tree/main/wg-easy"
arch:
  - aarch64
  - amd64
init: false
startup: services

# Everything WG-Easy stores lives in /data (see run.sh), which Home Assistant
# includes in its backups. Backups are "hot" (the default): the VPN stays up.
# Just before one, a consistent copy of the SQLite database is written, so the
# archive never holds only a half-written database (run.sh falls back to that
# copy if needed after a restore).
backup_pre: "node /app/server/addon/db-tool.mjs snapshot /data/wireguard/wg-easy.db /data/backups/ha-backup.db"

# The tunnel interface and LAN routing must behave exactly like on the host.
host_network: true

# Web interface is served as a sidebar panel via Home Assistant Ingress.
# No host port is published for the web UI; the proxy listens on the default
# ingress port, 8099.
ingress: true
panel_icon: "mdi:vpn"
panel_title: "WG-Easy"
# The panel opens WG-Easy already logged in as its administrator (see
# addon/ingress-proxy.mjs), so only Home Assistant administrators may open it
# (panel_admin, left at its default: true). Anyone who can open the panel can
# create VPN access to this network. Health is reported by the Dockerfile's
# HEALTHCHECK, which the Supervisor uses to restart a stuck add-on.

# Home Assistant entities are published through MQTT discovery when a broker
# (normally the Mosquitto add-on) is installed; its credentials come from the
# Supervisor, so there is nothing to configure. Optional: works without it.
services:
  - mqtt:want

# WireGuard only needs to create its interface and manage the nftables rules.
# SYS_MODULE is intentionally NOT requested: Home Assistant OS's kernel does not
# ship the netfilter modules as loadable files (`modprobe: FATAL: Module
# ip_tables not found`), so nothing here can or should load a kernel module.
privileged:
  - NET_ADMIN

# Nothing is required: the add-on works as installed. Everything else
# (DNS, MTU, keepalive, hooks, CIDRs, users, 2FA, metrics, ...) is set in the
# WG-Easy panel, exactly as with a standalone WG-Easy. The optional settings
# below override the panel on every start when they are filled in.
options:
  host: ""
  port: 51820
  # What VPN clients may reach beyond the tunnel and this Home Assistant host,
  # enforced on the server for ALL clients (FORWARD filter) and used as the
  # default AllowedIPs of NEW clients. Empty = Home Assistant only. Add your
  # LAN subnet (e.g. "192.168.0.0/24") to let clients reach the whole LAN.
  allowed_ips: ""
  disable_ipv6: true
  home_assistant_entities: true

schema:
  host: str?
  port: port
  allowed_ips: str?
  disable_ipv6: bool
  home_assistant_entities: bool
  dns: str?
  mtu: int(1280,1500)?
  persistent_keepalive: int(0,600)?
  ipv4_cidr: str?
  ipv6_cidr: str?
  metrics_port: port?
