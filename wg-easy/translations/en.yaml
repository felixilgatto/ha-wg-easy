configuration:
  host:
    name: "Public host"
    description: >-
      Public IP address or DNS name that VPN clients connect to. Leave empty to
      use the address detected on the first start (editable in the WG-Easy
      panel). When filled in, it replaces the panel's value on every start.
  port:
    name: "WireGuard port (UDP)"
    description: >-
      UDP port WireGuard listens on. Forward this port on your router to Home
      Assistant.
  allowed_ips:
    name: "Allowed networks"
    description: >-
      Extra ranges VPN clients may reach, comma-separated (e.g. your LAN
      192.168.1.0/24). Empty means Home Assistant only. Enforced on the server
      for every client, and used as the routing of new clients.
  disable_ipv6:
    name: "Disable IPv6"
    description: >-
      Disable IPv6 inside the tunnel. IPv4 is enough to reach a home network.
  home_assistant_entities:
    name: "Home Assistant entities"
    description: >-
      Create entities for the VPN and each client through MQTT, when the
      Mosquitto broker add-on is installed.
  dns:
    name: "DNS servers (override)"
    description: >-
      DNS servers given to new clients, comma-separated. Leave empty to manage
      them in the WG-Easy panel.
  mtu:
    name: "MTU (override)"
    description: >-
      MTU of the interface and of new clients. Leave empty to manage it in the
      WG-Easy panel.
  persistent_keepalive:
    name: "Persistent keepalive (override)"
    description: >-
      Keepalive interval in seconds for new clients (0 = off). Leave empty to
      manage it in the WG-Easy panel.
  ipv4_cidr:
    name: "Tunnel IPv4 range (first installation only)"
    description: >-
      Used only on the very first start. Afterwards, change it in the WG-Easy
      panel, which also renumbers existing clients.
  ipv6_cidr:
    name: "Tunnel IPv6 range (first installation only)"
    description: >-
      Used only on the very first start. Afterwards, change it in the WG-Easy
      panel.
  metrics_port:
    name: "Metrics port"
    description: >-
      Serve WG-Easy's Prometheus and JSON metrics on this port of your network.
      Enable them, and set a token, in the WG-Easy panel.
