name: "WG-Easy VPN"
description: "WireGuard VPN server with the WG-Easy web interface, exposed as a Home Assistant sidebar panel via Ingress. By default VPN clients reach only this Home Assistant host; add your LAN subnet to allowed_ips to reach the whole home LAN."
configuration:
  allowed_ips:
    name: "Allowed IPs"
    description: >-
      Which machines VPN clients may reach. Enforced on the server for every
      client on each start, and used as the AllowedIPs of NEW clients. The
      tunnel subnet only (default) means a client reaches this Home Assistant
      host and nothing else on the LAN. Add your LAN subnet (e.g. 192.168.0.0/24)
      to let clients reach every machine on your home LAN. The tunnel subnet and
      this host's own LAN address are always added automatically. Existing
      clients keep their own routing setting; to widen one, edit it in the web
      UI or recreate it.
